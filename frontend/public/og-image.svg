  <text x="190" y="472" font-family="system-ui" font-size="16" fill="#7A7269" text-anchor="middle">BOQ Generation</text>

  <text x="430" y="443" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#FF7510" text-anchor="middle">40–55</text>
  <text x="430" y="472" font-family="system-ui" font-size="16" fill="#7A7269" text-anchor="middle">BOQ Line Items</text>

  <text x="670" y="443" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#FF7510" text-anchor="middle">₹0</text>
